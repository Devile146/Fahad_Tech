<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fahad Tech Fonts Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* COMPLETE CENTERING: body flex center, no side shift */
    body {
      background: #02040a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
      margin: 0;
      padding: 12px 0;
    }

    /* MAIN 360px CONTAINER: perfectly centered, fixed width */
    .phone-container {
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      background: transparent;
      position: relative;
    }

    /* inner app wrapper - all sections have same width, no side overflow */
    .app-wrapper {
      width: 100%;
      padding: 14px 12px 85px 12px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
    }

    /* ========= PROFILE SECTION: fixed width, centered, no side issue ========= */
    .profile-area {
      text-align: center;
      width: 100%;
      margin-bottom: 4px;
    }
    .avatar {
      width: 78px;
      height: 78px;
      margin: 0 auto 6px;
      position: relative;
      cursor: pointer;
      border-radius: 50%;
    }
    .avatar::before {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(#00ffea, #ff44cc, #00ffaa, #00ffea);
      animation: avatarGlow 4s linear infinite;
      z-index: -1;
    }
    @keyframes avatarGlow {
      100% { filter: hue-rotate(360deg); }
    }
    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #02040a;
      background: #0e1625;
    }
    .profile-area h1 {
      color: #00ffea;
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow-x: auto;
      max-width: 100%;
      display: inline-block;
      padding: 0 4px;
      background: transparent;
    }
    /* for very narrow but still within 360, name won't break layout */
    .profile-area .sub {
      font-size: 9px;
      color: #8a98b5;
      margin-top: 2px;
      letter-spacing: 0.4px;
    }

    /* input group - full width consistent */
    .input-group {
      width: 100%;
      margin: 8px 0 6px;
    }
    .input-group input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 60px;
      background: #0b1322;
      border: 1.2px solid rgba(0, 255, 234, 0.5);
      color: white;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      outline: none;
      font-family: 'Poppins', monospace;
    }
    .input-group input::placeholder {
      color: #6a7c9e;
      font-weight: 400;
      font-size: 13px;
      opacity: 0.8;
    }
    .input-group input:focus {
      border-color: #00ffea;
      box-shadow: 0 0 6px rgba(0,255,234,0.3);
    }

    /* generate button - full width, same as other sections */
    .gen-btn {
      width: 100%;
      padding: 11px 0;
      border-radius: 60px;
      background: linear-gradient(95deg, #020812, #02162c);
      border: 1.5px solid #00ffea;
      color: #00ffea;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.08s linear;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .gen-btn:active {
      transform: scale(0.97);
      background: #00ffea20;
    }

    /* SCROLL AREA - fixed height, all cards have same width as parent */
    .fonts-scroll {
      width: 100%;
      height: 380px;
      overflow-y: auto;
      border-radius: 22px;
      padding: 2px 2px 6px 2px;
      scrollbar-width: thin;
    }
    .fonts-scroll::-webkit-scrollbar {
      width: 3px;
    }
    .fonts-scroll::-webkit-scrollbar-track {
      background: #0a1020;
      border-radius: 10px;
    }
    .fonts-scroll::-webkit-scrollbar-thumb {
      background: #00ffea;
      border-radius: 10px;
    }

    /* FONT CARDS: same width as all sections */
    .font-card {
      background: rgba(8, 18, 30, 0.9);
      backdrop-filter: blur(2px);
      border: 1px solid rgba(0, 255, 234, 0.35);
      border-radius: 18px;
      padding: 10px 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
    }
    .font-text {
      font-size: 0.78rem;
      font-weight: 500;
      word-break: break-word;
      color: #eef3ff;
      font-family: 'Courier New', monospace;
      flex: 1;
      line-height: 1.3;
    }
    .copy-btn {
      background: #010408;
      border: 1px solid #00ffea;
      color: #00ffea;
      padding: 5px 12px;
      border-radius: 40px;
      font-size: 0.68rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.05s;
    }
    .copy-btn:active {
      background: #00ffea30;
      transform: scale(0.96);
    }

    /* FIXED CONTACT BUTTON - chhota kiya (smaller than before) */
    .contact-mini {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 48px);
      max-width: 280px;
      background: linear-gradient(100deg, #25D366, #128C7E);
      border: none;
      padding: 10px 0;
      border-radius: 50px;
      color: white;
      font-weight: 700;
      font-size: 0.78rem;
      text-align: center;
      cursor: pointer;
      z-index: 200;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      letter-spacing: 0.6px;
    }
    .contact-mini:active {
      transform: translateX(-50%) scale(0.96);
    }

    /* photo viewer modal no effect on main layout */
    .photo-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.96);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 10000;
    }
    .photo-modal img {
      max-width: 82%;
      border-radius: 28px;
      border: 2px solid cyan;
      box-shadow: 0 0 20px cyan;
      object-fit: contain;
      background: #02040a;
    }
    .close-modal {
      margin-top: 24px;
      background: #02040a;
      border: 2px solid #00ffea;
      color: #00ffea;
      padding: 8px 28px;
      border-radius: 60px;
      font-weight: bold;
      cursor: pointer;
    }

    /* ensure all sections have identical width - no side shift */
    @media (max-width: 360px) {
      .app-wrapper {
        padding-left: 10px;
        padding-right: 10px;
      }
      .profile-area h1 {
        font-size: 1rem;
        white-space: normal;
        word-break: keep-all;
      }
      .font-text {
        font-size: 0.7rem;
      }
      .contact-mini {
        width: calc(100% - 40px);
        max-width: 260px;
        padding: 9px 0;
        font-size: 0.74rem;
      }
    }
  </style>
</head>
<body>
<div class="phone-container">
  <div class="app-wrapper">
    <!-- PROFILE: fixed width, name and dp perfectly centered -->
    <div class="profile-area">
      <div class="avatar" onclick="openPhotoModal()">
        <img id="profileImage" src="Fahad.jpg" alt="Fahad" onerror="this.src='https://avatars.githubusercontent.com/u/110894122?v=4'">
      </div>
      <h1>༺𓂃FAHAD_SINDHI𓂅࿐</h1>
      <div class="sub">⚡ FAHAD TECH STYLISH FONT GENERATOR ⚡</div>
    </div>

    <!-- input field - ab sirf placeholder hai, koi likha hua nahi -->
    <div class="input-group">
      <input type="text" id="userText" placeholder="✍️ ENTER TEXT" autocomplete="off" value="">
    </div>

    <!-- generate button - full width -->
    <button class="gen-btn" id="generateFontsBtn">🌀 GENERATE FONTS 🌀</button>

    <!-- fonts container - fixed height, scroll works -->
    <div class="fonts-scroll" id="fontsScrollArea">
      <div id="fontsList" style="display: flex; flex-direction: column; width: 100%;"></div>
    </div>
  </div>
</div>

<!-- FIXED CONTACT BUTTON -->
<button class="contact-mini" id="whatsappBtn">📲 CONTACT ME</button>

<div class="photo-modal" id="photoModal">

</div>

      a:"𝒶",b:"𝒷",c:"𝒸",d:"𝒹",e:"𝑒",f:"𝒻",g:"𝑔",h:"𝒽",i:"𝒾",j:"𝒿",k:"𝓀",l:"𝓁",m:"𝓂",n:"𝓃",o:"𝑜",p:"𝓅",q:"𝓆",r:"𝓇",s:"𝓈",t:"𝓉",u:"𝓊",v:"𝓋",w:"𝓌",x:"𝓍",y:"𝓎",z:"𝓏",

    },
    { // double-struck
      a:"𝕒",b:"𝕓",c:"𝕔",d:"𝕕",e:"𝕖",f:"𝕗",g:"𝕘",h:"𝕙",i:"𝕚",j:"𝕛",k:"𝕜",l:"𝕝",m:"𝕞",n:"𝕟",o:"𝕠",p:"𝕡",q:"𝕢",r:"𝕣",s:"𝕤",t:"𝕥",u:"𝕦",v:"𝕧",w:"𝕨",x:"𝕩",y:"𝕪",z:"𝕫",
      A:"𝔸",B:"𝔹",C:"ℂ",D:"𝔻",E:"𝔼",F:"𝔽",G:"𝔾",H:"ℍ",I:"𝕀",J:"𝕁",K:"𝕂",L:"𝕃",M:"𝕄",N:"ℕ",O:"𝕆",P:"ℙ",Q:"ℚ",R:"ℝ",S:"𝕊",T:"𝕋",U:"𝕌",V:"𝕍",W:"𝕎",X:"𝕏",Y:"𝕐",Z:"ℤ",0:"𝟘",1:"𝟙",2:"𝟚",3:"𝟛",4:"𝟜",5:"𝟝",6:"𝟞",7:"𝟟",8:"𝟠",9:"𝟡"
    },
    { // fraktur gothic
      a:"𝔞",b:"𝔟",c:"𝔠",d:"𝔡",e:"𝔢",f:"𝔣",g:"𝔤",h:"𝔥",i:"𝔦",j:"𝔧",k:"𝔨",l:"𝔩",m:"𝔪",n:"𝔫",o:"𝔬",p:"𝔭",q:"𝔮",r:"𝔯",s:"𝔰",t:"𝔱",u:"𝔲",v:"𝔳",w:"𝔴",x:"𝔵",y:"𝔶",z:"𝔷",
      A:"𝔄",B:"𝔅",C:"ℭ",D:"𝔇",E:"𝔈",F:"𝔉",G:"𝔊",H:"ℌ",I:"ℑ",J:"𝔍",K:"𝔎",L:"𝔏",M:"𝔐",N:"𝔑",O:"𝔒",P:"𝔓",Q:"𝔔",R:"ℜ",S:"𝔖",T:"𝔗",U:"𝔘",V:"𝔙",W:"𝔚",X:"𝔛",Y:"𝔜",Z:"ℨ",0:"𝟎",1:"𝟏",2:"𝟐",3:"𝟑",4:"𝟒",5:"𝟓",6:"𝟔",7:"𝟕",8:"𝟖",9:"𝟗"
    },
    { // monospace tech
      a:"𝚊",b:"𝚋",c:"𝚌",d:"𝚍",e:"𝚎",f:"𝚏",g:"𝚐",h:"𝚑",i:"𝚒",j:"𝚓",k:"𝚔",l:"𝚕",m:"𝚖",n:"𝚗",o:"𝚘",p:"𝚙",q:"𝚚",r:"𝚛",s:"𝚜",t:"𝚝",u:"𝚞",v:"𝚟",w:"𝚠",x:"𝚡",y:"𝚢",z:"𝚣",
      A:"𝙰",B:"𝙱",C:"𝙲",D:"𝙳",E:"𝙴",F:"𝙵",G:"𝙶",H:"𝙷",I:"𝙸",J:"𝙹",K:"𝙺",L:"𝙻",M:"𝙼",N:"𝙽",O:"𝙾",P:"𝙿",Q:"𝚀",R:"𝚁",S:"𝚂",T:"𝚃",U:"𝚄",V:"𝚅",W:"𝚆",X:"𝚇",Y:"𝚈",Z:"𝚉",0:"𝟶",1:"𝟷",2:"𝟸",3:"𝟹",4:"𝟺",5:"𝟻",6:"𝟼",7:"𝟽",8:"𝟾",9:"𝟿"
    },

      a:"ᴀ",b:"ʙ",c:"ᴄ",d:"ᴅ",e:"ᴇ",f:"ꜰ",g:"ɢ",h:"ʜ",i:"ɪ",j:"ᴊ",k:"ᴋ",l:"ʟ",m:"ᴍ",n:"ɴ",o:"ᴏ",p:"ᴘ",q:"ǫ",r:"ʀ",s:"ꜱ",t:"ᴛ",u:"ᴜ",v:"ᴠ",w:"ᴡ",x:"x",y:"ʏ",z:"ᴢ",
      A:"ᴀ",B:"ʙ",C:"ᴄ",D:"ᴅ",E:"ᴇ",F:"ꜰ",G:"ɢ",H:"ʜ",I:"ɪ",J:"ᴊ",K:"ᴋ",L:"ʟ",M:"ᴍ",N:"ɴ",O:"ᴏ",P:"ᴘ",Q:"ǫ",R:"ʀ",S:"ꜱ",T:"ᴛ",U:"ᴜ",V:"ᴠ",W:"ᴡ",X:"x",Y:"ʏ",Z:"ᴢ",0:"⁰",1:"¹",2:"²",3:"³",4:"⁴",5:"⁵",6:"⁶",7:"⁷",8:"⁸",9:"⁹"
    }
  ];

  function pickRandomFont() {
    return fontStyles[Math.floor(Math.random() * fontStyles.length)];
  }

  function convertText(text, fontMap) {
    let result = "";
    for(let ch of text) {
      result += fontMap[ch] || ch;
    }
    return result;
  }

  // Generate stylish fonts
  function generateStylishFonts() {
    const inputEl = document.getElementById("userText");
    let raw = inputEl.value.trim();
    if(raw === "") {
      alert("");
      return;
    }
    
    const container = document.getElementById("fontsList");
    container.innerHTML = "";
    
    const totalCards = 58;
    for(let i = 0; i < totalCards; i++) {
      const fontMap = pickRandomFont();
      let styledRaw = convertText(raw, fontMap);
      
      const leftSym = symbolList[Math.floor(Math.random() * symbolList.length)];
      const rightSym = symbolList[Math.floor(Math.random() * symbolList.length)];
      const extraGlitch = Math.random() > 0.65 ? ` ${symbolList[Math.floor(Math.random() * symbolList.length)]} ` : " ";
      const finalDisplay = `${leftSym}${leftSym} ${styledRaw}${extraGlitch}${rightSym}${rightSym}`;
      
      const card = document.createElement("div");
      card.className = "font-card";
      
      const textSpan = document.createElement("span");
      textSpan.className = "font-text";
      textSpan.textContent = finalDisplay;
      
      const copySpan = document.createElement("span");
      copySpan.className = "copy-btn";
      copySpan.textContent = "COPY";
      
      copySpan.addEventListener("click", (function(copyContent) {
        return function() {
          navigator.clipboard.writeText(copyContent).then(() => {
            copySpan.textContent = "✓ DONE";
            setTimeout(() => { copySpan.textContent = "COPY"; }, 900);
          }).catch(() => alert("Manual copy"));
        };
      })(finalDisplay));
      
      card.appendChild(textSpan);
      card.appendChild(copySpan);
      container.appendChild(card);
    }
  }

  // WhatsApp contact handler
  function openWhatsApp() {
    window.open("https://wa.me/923251138959?text=HELLO%20FAHAD%20SIR%20-%20360PX%20FONTS", "_blank");
  }

  // Photo viewer - show Fahad.jpg image
  function openPhotoModal() {
    const modal = document.getElementById("photoModal");
    const profileImg = document.getElementById("profileImage");
    const modalImg = document.getElementById("modalImg");
    modalImg.src = profileImg.src;
    modal.style.display = "flex";
  }
  
  function closePhotoModal() {
    document.getElementById("photoModal").style.display = "none";
  }

  // Ensure Fahad.jpg loads properly
  function setupProfileImage() {
    const profileImg = document.getElementById("profileImage");
    // Try to load Fahad.jpg from the same directory/GitHub
    profileImg.src = "Fahad.jpg";
    // If Fahad.jpg fails to load, use GitHub avatar as fallback
    profileImg.onerror = function() {
      console.log("Fahad.jpg not found, using GitHub avatar fallback");
      this.src = "https://avatars.githubusercontent.com/u/110894122?v=4";
    };
  }

  // ensure everything is centered, widths consistent
  document.addEventListener("DOMContentLoaded", () => {
    setupProfileImage();
    
    const genButton = document.getElementById("generateFontsBtn");
    genButton.addEventListener("click", generateStylishFonts);
    const contactBtn = document.getElementById("whatsappBtn");
    contactBtn.addEventListener("click", openWhatsApp);
    const textInput = document.getElementById("userText");
    textInput.addEventListener("keypress", (e) => {
      if(e.key === "Enter") generateStylishFonts();
    });
    
    // Input field is completely empty, only placeholder shows
    textInput.value = "";
    
    window.addEventListener("resize", () => {
      if(window.innerWidth > 360) {
        document.body.style.justifyContent = "center";
      }
    });
  });
</script>
